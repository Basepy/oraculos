name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Verify the roster
        if: github.event_name != 'pull_request'
        run: python scripts/verify.py oracles.json

      - name: Verify the roster (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          git show "origin/${BASE_REF}:oracles.json" > "${RUNNER_TEMP}/base.json"
          python scripts/verify.py oracles.json --base "${RUNNER_TEMP}/base.json" --author "${PR_AUTHOR}"
